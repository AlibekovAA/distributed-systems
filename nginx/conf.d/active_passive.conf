upstream auth_backend {
    server auth-service-primary:8000;
    server auth-service-secondary:8002 backup;
}

map $http_origin $cors_origin {
    default "";
    "http://localhost" $http_origin;
    "http://localhost:80" $http_origin;
}

map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location /api/auth/ {
        proxy_pass http://auth_backend/auth/;
        include /etc/nginx/conf.d/proxy_common.inc;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

    }

    location = /api/products {
        proxy_pass http://product-catalog-service:8080/products;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location /api/products/ {
        proxy_pass http://product-catalog-service:8080/products/;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location /api/order/ {
        proxy_pass http://product-catalog-service:8080/order/;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location /api/orders/ {
        proxy_pass http://product-catalog-service:8080/orders/;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
