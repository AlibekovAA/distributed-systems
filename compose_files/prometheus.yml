global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service-primary:8001']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'product-catalog-service'
    static_configs:
      - targets: ['product-catalog-service:8081']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 5s
    metrics_path: '/metrics'
