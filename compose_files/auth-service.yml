services:
  auth-service-primary:
    build:
      context: ..
      dockerfile: backend/auth-service/Dockerfile
    container_name: auth_service_primary
    restart: unless-stopped
    env_file: "../.env"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  auth-service-secondary:
    build:
      context: ..
      dockerfile: backend/auth-service/Dockerfile
    container_name: auth_service_secondary
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--log-level", "info"]
    env_file: "../.env"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network
