<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | E-Commerce Platform</title>

    <link rel="stylesheet" href="/styles/common/base.css">
    <link rel="stylesheet" href="/styles/common/notifications.css">
    <link rel="stylesheet" href="/styles/common/loader.css">
    <link rel="stylesheet" href="/styles/common/layout.css">
    <link rel="stylesheet" href="/modules/profile/profile.css">
    <script type="module" src="/modules/profile/profile.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="side-menu">
        <div class="menu-content">
            <div class="menu-items-top">
                <a href="#" class="menu-item active" aria-current="page">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
                    <span class="menu-text">Profile</span>
                </a>
                <a href="/pages/catalog/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18l-2-6H5l-2 6Z"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>
                    <span class="menu-text">Catalog</span>
                </a>
                <a href="/pages/cart/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h10l2-7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></span>
                    <span class="menu-text">Cart</span>
                </a>
                <a href="/pages/history/index.html" class="menu-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/></svg></span>
                    <span class="menu-text">History</span>
                </a>
            </div>
            <div class="menu-items-bottom">
                <a href="#" id="logoutBtn" class="menu-item logout-item">
                    <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/></svg></span>
                    <span class="menu-text">Logout</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="profile-container" aria-busy="false">
        <div class="profile-card card">
            <h1>User Profile</h1>
            <div class="profile-info">
                <div class="info-group">
                    <span class="info-label">Email:</span>
                    <span id="userEmail"></span>
                </div>
                <div class="info-group">
                    <span class="info-label">Name:</span>
                    <span id="userName"></span>
                </div>
            </div>

            <div class="change-password-section">
                <h3>Change Password</h3>
                <form id="changePasswordForm" class="password-form" novalidate>
                    <input type="text"
                           name="username"
                           autocomplete="username"
                           hidden
                           aria-hidden="true"
                           tabindex="-1">
                    <div class="form-group">
                        <label class="sr-only" for="oldPassword">Current Password</label>
                        <input type="password"
                               id="oldPassword"
                               class="input"
                               placeholder="Current Password"
                               autocomplete="current-password"
                               required>
                    </div>
                    <div class="form-group">
                        <label class="sr-only" for="newPassword">New Password</label>
                        <input type="password"
                               id="newPassword"
                               class="input"
                               placeholder="New Password"
                               autocomplete="new-password"
                               required>
                    </div>
                    <div class="form-group">
                        <label class="sr-only" for="confirmNewPassword">Confirm New Password</label>
                        <input type="password"
                               id="confirmNewPassword"
                               class="input"
                               placeholder="Confirm New Password"
                               autocomplete="new-password"
                               required>
                    </div>
                    <button type="submit" class="btn change-password-btn">Change Password</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
